# Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA Redirects for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache Control: ensure index.html is never cached stale while hashed assets are cached immutably
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Local dev: proxy API calls to Netlify Functions
[dev]
  command = "npx vite --host"
  targetPort = 5173
  port = 8888
  autoLaunch = false

